# Publish the rendered documents to GitHub Pages.
#
#   push to main            -> site root        https://<owner>.github.io/<repo>/
#   pull request #N         -> pr/N/            https://<owner>.github.io/<repo>/pr/N/
#
# Every deploy uses keep_files so that earlier previews survive: a PR's
# preview is persistent. It is updated on each push to the PR and is NOT
# removed when the PR closes, so review links in the PR stay live.
#
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch",
# branch gh-pages, folder / (root). The first run creates the branch.
#
# Pull requests from forks run with a read-only token and cannot deploy;
# they only build (PR-04 in srd-barge.md).

name: pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A newer push to the same PR cancels the older run (the deploy job's own lock below keeps gh-pages safe).
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Serialise deploys so two pushes to gh-pages do not race each other. Only this job holds the lock:
    # the wait for the preview to go live is a job of its own, so it no longer delays the next deploy.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    outputs:
      url: ${{ steps.paths.outputs.url }}
    env:
      IS_PR: ${{ github.event_name == 'pull_request' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The commit being previewed: the PR head, not the synthetic merge commit.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # True for same-repository PRs, false for forks (no write token).
      CAN_DEPLOY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc

      - name: Resolve site paths
        id: paths
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          if [ "$IS_PR" = "true" ]; then
            echo "dest=pr/${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "url=${base}/pr/${PR_NUMBER}/" >> "$GITHUB_OUTPUT"
            echo "banner=Preview of pull request #${PR_NUMBER} (${SOURCE_SHA::7}). Not the published document." >> "$GITHUB_OUTPUT"
          else
            echo "dest=" >> "$GITHUB_OUTPUT"
            echo "url=${base}/" >> "$GITHUB_OUTPUT"
            echo "banner=" >> "$GITHUB_OUTPUT"
          fi

      - name: Say on the PR that the preview is building
        if: env.IS_PR == 'true' && env.CAN_DEPLOY == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.paths.outputs.url }}
        with:
          script: |
            await require('./.github/scripts/preview-comment.js')({ github, context, state: 'building' });

      - name: Build site
        run: scripts/build-site.sh site "${{ steps.paths.outputs.banner }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/cache@v4
        with:
          path: .cache
          key: pyodide-${{ hashFiles('web/scripts/fetch-pyodide.mjs') }}

      - name: Build the demonstrator into site/demo, with its data folder
        working-directory: web
        env:
          # Pyodide is published once at the site root and shared by every
          # preview (same origin, NFR-08); the path is relative.
          VITE_SHARED_PATH: ${{ env.IS_PR == 'true' && '../../../' || '../' }}
        run: |
          # D-364: stamp the build, for the Overview panel and for the live check below.
          export VITE_BUILD_SHA="${SOURCE_SHA::7}"
          export VITE_BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M UTC')"
          pip install -r ../backend/requirements-dev.txt
          python ../scripts/build_data_folder.py
          python ../scripts/build_data_folder.py --check
          npm ci
          npm run pyodide
          npm run build
          cp -r dist ../site/demo
          printf '{"sha":"%s","built":"%s"}\n' "$VITE_BUILD_SHA" "$VITE_BUILD_TIME" > ../site/demo/version.json
          mkdir -p ../shared/pyodide
          cp -r ../.cache/pyodide/0.29.5 ../shared/pyodide/

      - name: Upload rendered site (always, so fork PRs can still be inspected)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy to gh-pages
        if: env.CAN_DEPLOY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          destination_dir: ${{ steps.paths.outputs.dest }}
          # Persistent previews: never wipe other PRs' folders (or the root).
          keep_files: true
          commit_message: "deploy ${{ steps.paths.outputs.dest || 'root' }} from ${{ env.SOURCE_SHA }}"

      - name: Deploy the shared Pyodide to the site root
        if: env.CAN_DEPLOY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./shared
          keep_files: true
          commit_message: "deploy shared pyodide from ${{ env.SOURCE_SHA }}"

  preview-live:
    # D-364: say on the PR when the preview serves this build. Outside the gh-pages lock, and short-lived:
    # it needs no checkout of the whole history, only the comment script.
    needs: build-and-deploy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Wait until the preview serves this build, then say so on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ needs.build-and-deploy.outputs.url }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            // D-364: GitHub Pages publishes the gh-pages branch some time after the push; poll the preview's
            // version.json until it names this commit (up to ten minutes).
            const sha = process.env.SOURCE_SHA.substring(0, 7);
            const started = Date.now();
            let live = false;
            while (Date.now() - started < 10 * 60_000) {
              try {
                const r = await fetch(`${process.env.PREVIEW_URL}demo/version.json?t=${Date.now()}`, { cache: 'no-store' });
                if (r.ok && (await r.json()).sha === sha) { live = true; break; }
              } catch {}
              await new Promise((res) => setTimeout(res, 15_000));
            }
            const when = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            const waited = `${Math.round((Date.now() - started) / 60_000)} min`;
            await require('./.github/scripts/preview-comment.js')({ github, context, state: live ? 'live' : 'late', detail: live ? `since ${when}` : waited });
