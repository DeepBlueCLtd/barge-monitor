# Publish the rendered documents to GitHub Pages.
#
#   push to main            -> site root        https://<owner>.github.io/<repo>/
#   pull request #N         -> pr/N/            https://<owner>.github.io/<repo>/pr/N/
#
# Each holds the SRD at its root and the demonstrator under demo/. Pyodide is
# published once per version to pyodide/<version>/ at the site root and is
# shared by every preview.
#
# Every deploy uses keep_files so that earlier previews survive: a PR's
# preview is persistent. It is updated on each push to the PR and is NOT
# removed when the PR closes, so review links in the PR stay live.
#
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch",
# branch gh-pages, folder / (root). The first run creates the branch.
#
# Pull requests from forks run with a read-only token and cannot deploy;
# they only build (PR-04 in srd-barge.md).

name: pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialise deploys so two pushes to gh-pages do not race each other.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IS_PR: ${{ github.event_name == 'pull_request' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The commit being previewed: the PR head, not the synthetic merge commit.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # True for same-repository PRs, false for forks (no write token).
      CAN_DEPLOY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc

      - name: Resolve site paths
        id: paths
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          if [ "$IS_PR" = "true" ]; then
            echo "dest=pr/${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "url=${base}/pr/${PR_NUMBER}/" >> "$GITHUB_OUTPUT"
            echo "banner=Preview of pull request #${PR_NUMBER} (${SOURCE_SHA::7}). Not the published document." >> "$GITHUB_OUTPUT"
          else
            echo "dest=" >> "$GITHUB_OUTPUT"
            echo "url=${base}/" >> "$GITHUB_OUTPUT"
            echo "banner=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        run: scripts/build-site.sh site "${{ steps.paths.outputs.banner }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ hashFiles('web/scripts/fetch-pyodide.mjs') }}

      - name: Build the demonstrator into site/demo
        working-directory: web
        env:
          # Pyodide is published once per version at the site root and shared
          # by every preview (same origin, NFR-06); the path is relative.
          VITE_PYODIDE_PATH: ${{ env.IS_PR == 'true' && '../../../pyodide/0.29.5/' || '../pyodide/0.29.5/' }}
        run: |
          npm ci
          npm run pyodide
          npm run build
          cp -r dist ../site/demo

      - name: Upload rendered site (always, so fork PRs can still be inspected)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

      - name: Deploy to gh-pages
        if: env.CAN_DEPLOY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          destination_dir: ${{ steps.paths.outputs.dest }}
          # Persistent previews: never wipe other PRs' folders (or the root).
          keep_files: true
          commit_message: "deploy ${{ steps.paths.outputs.dest || 'root' }} from ${{ env.SOURCE_SHA }}"

      - name: Deploy Pyodide to the shared versioned folder
        if: env.CAN_DEPLOY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.cache/pyodide/0.29.5
          destination_dir: pyodide/0.29.5
          keep_files: true
          commit_message: "deploy pyodide 0.29.5"

      - name: Comment preview link on the PR
        if: env.IS_PR == 'true' && env.CAN_DEPLOY == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.paths.outputs.url }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const body = [
              marker,
              `**Demonstrator preview:** ${process.env.PREVIEW_URL}demo/`,
              `**Documents preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Rendered from ${process.env.SOURCE_SHA.substring(0, 7)}. The link is persistent: it is updated on every push and stays after the PR closes. Pages may take a minute to refresh.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
