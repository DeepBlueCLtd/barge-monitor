# AT-32 (plan-v4.7 Phase 10): the server-neutral contract suite straight against a stock OpenSensorHub 2.0.4,
# configured as docs/v4-interfaces.md §14 allows (backend/independent/at32_osh.py; D-344). Run on demand only:
# it builds OpenSensorHub from source, and AT-32 is not passed today (D-348), so it is not a gate on pull requests.
name: at32

on:
  workflow_dispatch:

jobs:
  opensensorhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install -r backend/requirements-dev.txt websockets==17.4
      - name: OpenSensorHub osh-core 2.0.4 (75bb094), unmodified (backend/independent/README.md)
        run: |
          git clone https://github.com/opensensorhub/osh-core ../osh-core
          cd ../osh-core && git checkout 75bb094
          ./gradlew installDist -x test -x javadoc
      - name: The data folder, read by the importer (FR-15)
        run: python scripts/build_data_folder.py
      - name: AT-32
        run: python backend/independent/at32_osh.py --osh ../osh-core/build/install/osh-core --json at32-osh-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: at32-osh-results
          path: at32-osh-results.json
